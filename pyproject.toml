[project]
name = "wedding"
version = "0.10.0"
description = "Digital hub for our wedding: RSVP via personal QR code, day-of info, and more fun features TBD."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "flask-limiter>=4.1.1",
  "flask>=3.0",
  "pydantic-yaml>=1.7.0",
  "pydantic>=2.14.1",
  "rich>=15.0.0",
  "sqlalchemy>=2.1.5",
]

[dependency-groups]
dev = [
  "djlint>=1.46.6",
  "isort>=9.0.2",
  "mypy>=2.4.0",
  "pre-commit>=4.7.0",
  "pytest-cov>=7.1.0",
  "pytest-playwright>=0.10.0",
  "pytest>=9.1.1",
  "ruff>=0.17.1",
  "taplo>=0.9.3",
]

[tool.ruff]
target-version = "py312"
line-length = 119

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[project]
name = "wedding"
version = "0.1.1"
description = "Digital hub for our wedding: RSVP via personal QR code, day-of info, and more fun features TBD."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.0",
  "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
  "djlint>=1.43.1",
  "mypy>=1.11",
  "pytest>=9.1.1",
  "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[project]
name = "wedding"
version = "0.8.0"
description = "Digital hub for our wedding: RSVP via personal QR code, day-of info, and more fun features TBD."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "flask-limiter>=4.1.1",
  "flask>=3.0",
  "pydantic-yaml>=1.7.0",
  "pydantic>=2.13.4",
  "rich>=15.0.0",
  "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
  "djlint>=1.44.2",
  "isort>=8.0.1",
  "mypy>=1.11",
  "pre-commit>=4.6.2",
  "pytest-cov>=7.1.0",
  "pytest>=9.1.1",
  "ruff>=0.16.3",
  "taplo>=0.9.3",
]

[tool.ruff]
target-version = "py312"
line-length = 119

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

---
name: CI

on:
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Check for changed files
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python || steps.force.outputs.all }}
      shell: ${{ steps.filter.outputs.shell || steps.force.outputs.all }}
      yaml: ${{ steps.filter.outputs.yaml || steps.force.outputs.all }}
      toml: ${{ steps.filter.outputs.toml || steps.force.outputs.all }}
      html: ${{ steps.filter.outputs.html || steps.force.outputs.all }}
      css: ${{ steps.filter.outputs.css || steps.force.outputs.all }}
      markdown: ${{ steps.filter.outputs.markdown || steps.force.outputs.all }}
      actions: ${{ steps.filter.outputs.actions || steps.force.outputs.all }}
      pyproject: ${{ steps.filter.outputs.pyproject || steps.force.outputs.all }}
      tests: ${{ steps.filter.outputs.tests || steps.force.outputs.all }}
    steps:
      # Only pull_request runs have a base ref to diff against. On a
      # schedule/workflow_dispatch run there's no "changed files" concept, so
      # skip the diff entirely and force every check to run instead (below).
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            python:
              - '**/*.py'
            shell:
              - '**/*.sh'
            yaml:
              - '**/*.yml'
              - '**/*.yaml'
            toml:
              - '**/*.toml'
            html:
              - '**/*.html'
            css:
              - '**/*.css'
            markdown:
              - '**/*.md'
            actions:
              - '.github/workflows/**/*.yml'
              - '.github/workflows/**/*.yaml'
            pyproject:
              - 'pyproject.toml'
              - 'uv.lock'
            tests:
              - 'tests/**'

      - name: Force all checks to run
        id: force
        if: github.event_name != 'pull_request'
        run: echo "all=true" >> "$GITHUB_OUTPUT"

  python-lint:
    name: Python lint (ruff)
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.pyproject == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  python-typecheck:
    name: Python type check (mypy)
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.pyproject == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Run mypy
        run: uv run mypy .

  python-test:
    name: Python tests (pytest)
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.pyproject == 'true'  || needs.changes.outputs.tests == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Run pytest
        run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=85

  lockfile-check:
    name: Lockfile check (uv)
    needs: changes
    if: ${{ needs.changes.outputs.pyproject == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check lockfile consistency
        run: uv sync --locked

  html-lint:
    name: HTML/Jinja lint (djlint)
    needs: changes
    if: ${{ needs.changes.outputs.html == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Run djlint
        run: uv run djlint . --profile=jinja

  css-lint:
    name: CSS lint (stylelint)
    needs: changes
    if: ${{ needs.changes.outputs.css == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install stylelint
        run: npm install --no-save stylelint stylelint-config-standard

      - name: Run stylelint
        run: npx stylelint "**/*.css"

  markdown-lint:
    name: Markdown lint (markdownlint-cli2)
    needs: changes
    if: ${{ needs.changes.outputs.markdown == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: '**/*.md'

  shell-lint:
    name: Shell lint (shellcheck + shfmt)
    needs: changes
    if: ${{ needs.changes.outputs.shell == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'

      - name: Install shfmt
        uses: mfinelli/setup-shfmt@v4

      - name: Run shfmt (format check)
        run: git ls-files '*.sh' | xargs shfmt -d

  toml-lint:
    name: TOML lint (taplo)
    needs: changes
    if: ${{ needs.changes.outputs.toml == 'true' || needs.changes.outputs.pyproject == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Run taplo lint
        run: uv run taplo lint -- *.toml .*.toml

      - name: Run taplo format check
        run: uv run taplo fmt --check -- *.toml .*.toml

  actions-lint:
    name: GitHub Actions lint (actionlint)
    needs: changes
    if: ${{ needs.changes.outputs.actions == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Run actionlint
        run: ./actionlint -color

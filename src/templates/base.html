<!DOCTYPE html>
<html lang="{%- block lang -%}sw{%- endblock -%}">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="{%- block description -%}Default description{%- endblock -%}">
        <title>{{ config.app_name }}</title>
        <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
        <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
        />
        <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD"
        crossorigin="anonymous"
        />
        <link
        rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
        crossorigin="anonymous"
        />
    </head>
    <body class="d-flex flex-column min-vh-100">
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbar"
                    aria-controls="navbar"
                    aria-expanded="false"
                    aria-label="Visa/dölj meny"
                    >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbar">
                    <div class="navbar-nav">
                        <a class="nav-item nav-link" id="home" href="{{ url_for('home.home') }}">Hem</a>
                        <a class="nav-item nav-link" id="RSVP" href="{{ url_for('rsvp.rsvp') }}">OSA</a>
                        <a class="nav-item nav-link" id="itinerary" href="{{ url_for('itinerary.itinerary') }}">Schema</a>
                        <a class="nav-item nav-link" id="seating" href="{{ url_for('seating.seating') }}">Bordsplacering</a>
                    </div>
                </div>
            </nav>
        </header>

        <main class="flex-grow-1">
            <h1 class="text-center">{% block header %}{{ config.app_name }} - Default Header{% endblock %}</h1>

            <div class="container">{% block content %}{% endblock %}</div>
        </main>

        <div class="container">
            <footer class="d-flex flex-wrap justify-content-between align-items-center py-2 mt-4 border-top">
                <span class="text-center text-muted"><i class="fa fa-copyright"></i> {{ current_year }} {{ config.app_name }}.</span>
                <ul class="nav col-md-4 justify-content-end">
                    <li class="nav-item">
                        <a href="{{ url_for('contact.contact') }}" class="nav-link px-2 text-muted">Kontakta oss</a>
                    </li>
                </ul>
            </footer>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"
                ></script>
    </body>
</html>
